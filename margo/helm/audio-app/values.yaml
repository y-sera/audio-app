# Default values for the audio-app chart.
#
# Margo note: the namespace is chosen by the Workload Fleet Manager, so no
# template sets metadata.namespace. Templates also avoid `lookup`, hooks and
# CRDs (see the Helm exceptions in the Margo application description spec).

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# ------------------------------------------------------------
# audio-app: microphone capture + VAD + transcription client
# ------------------------------------------------------------
app:
  # Set to false to deploy only the LiteRT-LM server (e.g. on hosts without a
  # microphone, such as CI). The UI is then not deployed either.
  enabled: true

  image:
    repository: ghcr.io/y-sera/audio-app/audio-app
    # Defaults to .Chart.AppVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent

  logLevel: INFO

  # Prompt sent with each utterance. Empty uses the app's built-in
  # English transcription prompt.
  transcriptionPrompt: ""

  # LiteRT-LM server API settings. When llm.enabled is true, baseUrl is
  # derived from the bundled LiteRT-LM service and model from llm.model.id.
  openai:
    apiKey: dummy
    baseUrl: ""
    model: ""

  vad:
    threshold: 0.3
    thresholdEnd: 0.2
    gain: 1.0
    autoNorm: true
    targetPeak: 0.6
    maxNormGain: 16.0
    clipLimit: 0.02
    minSpeechMs: 150
    minSilenceMs: 700

  # How /dev/snd is exposed to the container.
  audioDevice:
    # devicePlugin: request an extended resource advertised by a device
    #               plugin (e.g. squat/generic-device-plugin) on the node.
    # hostPath:     mount the host's /dev/snd and run privileged.
    mode: devicePlugin
    resourceName: devic.es/audio
    hostPath: /dev/snd

  # Read-only transcript API (JSON + Server-Sent Events) read by the UI.
  # Enabled together with the UI.
  api:
    port: 8000
    # Number of recent transcripts kept in memory.
    history: 200

  # Where the WAV of each utterance is written.
  recordings:
    path: /data/recordings
    persistence:
      enabled: false
      storageClassName: ""
      size: 1Gi

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ------------------------------------------------------------
# UI: web page showing the transcripts (Vite + React on nginx)
# ------------------------------------------------------------
ui:
  # Requires app.enabled.
  enabled: true

  image:
    repository: ghcr.io/y-sera/audio-app/ui
    tag: ""
    pullPolicy: IfNotPresent

  service:
    # NodePort makes the UI reachable at http://<node-ip>:<nodePort>.
    # Use ClusterIP to expose it through an Ingress or port-forward instead.
    type: NodePort
    port: 80
    # Ignored unless type is NodePort; empty lets Kubernetes pick one.
    nodePort: 30080

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ------------------------------------------------------------
# LiteRT-LM: OpenAI-compatible LLM server (Gemma)
# ------------------------------------------------------------
llm:
  # Set to false to use an external LiteRT-LM server
  # (then set app.openai.baseUrl and app.openai.model).
  enabled: true

  image:
    repository: ghcr.io/y-sera/audio-app/litert-lm
    tag: ""
    pullPolicy: IfNotPresent

  port: 8080
  verbose: true

  model:
    # Model ID registered with `litert-lm import` and requested by the app.
    id: gemma-4-E2B-it.litertlm
    # Downloaded by an init container when not yet present in the cache.
    download:
      enabled: true
      huggingfaceRepo: litert-community/gemma-4-E2B-it-litert-lm
      file: gemma-4-E2B-it.litertlm
      # Optional Secret (key: token) for gated HuggingFace repositories.
      tokenSecretName: ""
    # Inference backend: cpu | gpu. With gpu, the settings under llm.gpu
    # are applied to the LiteRT-LM pod (GPU access via Vulkan).
    backend: cpu
    audioBackend: cpu

  # Applied only when llm.model.backend is gpu.
  gpu:
    # RuntimeClass that exposes the GPU to the container, e.g. "nvidia".
    # Empty uses the cluster default runtime.
    runtimeClassName: nvidia
    # Extra resource limits, e.g. {nvidia.com/gpu: 1} or {amd.com/gpu: 1}.
    resources: {}
    # Extra environment variables, e.g. NVIDIA_DRIVER_CAPABILITIES.
    env: []

  persistence:
    enabled: true
    # Use an existing PVC for the model cache instead of creating one.
    existingClaim: ""
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 5Gi

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: "2"
      memory: 2000Mi
    limits:
      cpu: "4"
      memory: 3000Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
